<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - {{ lang_name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem 5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 800px;
        }
        h1 {
            font-size: 3rem;
            color: #333;
            margin: 0 0 1rem 0;
        }
        .language-info {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }
        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .lang-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .flag {
            font-size: 1.5rem;
        }
        
        /* Currency Converter Styles */
        .currency-converter {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }
        .converter-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .converter-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            padding: 0.75rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .convert-btn {
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .convert-btn:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 1.2rem;
            color: #333;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
        .exchange-rate {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .error {
            color: #dc3545;
            margin-top: 0.5rem;
            display: none;
        }
        .error.show {
            display: block;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            .lang-btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
            .form-row {
                flex-direction: column;
            }
            .converter-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ greeting }}</h1>
        <div class="language-info">
            <em>{{ lang_name }}</em>
        </div>
        
        <div class="language-switcher">
            {% for code, lang in languages.items() %}
                <a href="/{% if code != 'en' %}{{ code }}{% endif %}" 
                   class="lang-btn {% if code == current_lang %}active{% endif %}">
                    <span class="flag">{{ lang.flag }}</span>
                    <span>{{ lang.name }}</span>
                </a>
            {% endfor %}
        </div>
        
        <!-- Currency Converter -->
        <div class="currency-converter">
            <h2 class="converter-title">💱 Currency Converter</h2>
            <div class="converter-form">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" value="100" min="0" step="0.01">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fromCurrency">From</label>
                        <select id="fromCurrency">
                            {% for code, curr in currencies.items() %}
                                <option value="{{ code }}">{{ curr.symbol }} {{ code }} - {{ curr.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="toCurrency">To</label>
                        <select id="toCurrency">
                            {% for code, curr in currencies.items() %}
                                <option value="{{ code }}" {% if code == 'EUR' %}selected{% endif %}>{{ curr.symbol }} {{ code }} - {{ curr.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button class="convert-btn" onclick="convertCurrency()">Convert</button>
                <div id="result" class="result"></div>
                <div id="error" class="error"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function convertCurrency() {
            const amount = document.getElementById('amount').value;
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            
            // Hide previous results
            resultDiv.classList.remove('show');
            errorDiv.classList.remove('show');
            
            // Validate input
            if (!amount || amount <= 0) {
                errorDiv.textContent = 'Please enter a valid amount';
                errorDiv.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        from_currency: fromCurrency,
                        to_currency: toCurrency
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const currencies = {{ currencies | tojson }};
                    const fromSymbol = currencies[fromCurrency].symbol;
                    const toSymbol = currencies[toCurrency].symbol;
                    
                    resultDiv.innerHTML = `
                        <div class="result-amount">
                            ${fromSymbol}${data.amount} ${fromCurrency} = ${toSymbol}${data.converted_amount} ${toCurrency}
                        </div>
                        <div class="exchange-rate">
                            Exchange Rate: 1 ${fromCurrency} = ${data.exchange_rate} ${toCurrency}
                        </div>
                    `;
                    resultDiv.classList.add('show');
                } else {
                    errorDiv.textContent = data.error || 'Conversion failed';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Error connecting to server';
                errorDiv.classList.add('show');
            }
        }
        
        // Allow Enter key to trigger conversion
        document.getElementById('amount').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                convertCurrency();
            }
        });
    </script>
</body>
</html>
