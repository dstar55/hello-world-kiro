# Runs on the Hetzner VM at /opt/hello-world/docker-compose.yml
# (the GitHub Actions workflow copies this file there on every deploy)
services:
  app:
    image: ghcr.io/dstar55/hello-world-kiro:latest
    restart: unless-stopped
    ports:
      # Bound to localhost only; host nginx serves https://kiro.fractus.io and proxies here
      - "127.0.0.1:8080:8000"
    volumes:
      # Persist SQLite database across container restarts
      - ./data:/app/data
    environment:
      # Environment variables for configuration
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DATABASE_URL=sqlite:///data/users.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
